---
layout: default
---
<!doctype html>


<html lang="en">

<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/8.0.0/mermaid.min.js"></script>
</head>

<body>
	<pre><code class="language-mermaid">graph LR
A--&gt;B
</code></pre>

	<div class="mermaid">graph LR
		A--&gt;B
	</div>

</body>
<script>
	var config = {
		startOnLoad: true,
		theme: 'forest',
		flowchart: {
			useMaxWidth: false,
			htmlLabels: true
		}
	};
	mermaid.initialize(config);
	window.mermaid.init(undefined, document.querySelectorAll('.language-mermaid'));
</script>

</html>






<html>

<head>
	<article class="post-container post-container--single" itemscope itemtype="http://schema.org/BlogPosting">
		<header class="post-header">
			<div class="post-meta">
				<time datetime="{{page.date | date: date_to_xmlschema}}" itemprop="datePublished"
					class="post-meta__date date">{{page.date | date: "%F"}}</time> &#8226; <span
					class="post-meta__tags tags">{{page.tags | join:' '}}</span>
			</div>

			{% include post-tag.html %}
			<br>

			<h1 class="post-title">{{ page.title }}</h1>

		</header>

		<section class="post">
			{{ content }}
		</section>
	</article>

	{% include read-more.html %}
	{% include comments.html %}
	{% include valine.html %}

</html>
