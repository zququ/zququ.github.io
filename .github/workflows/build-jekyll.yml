name: Deploy encrypted private portal

on:
  push:
    branches:
      - quu-Precision
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify isolated deployment allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.nojekyll\n404.html\nCNAME\nindex.html\npayload.bin\nrobots.txt'
          actual="$(find private_portal/dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          test "$(cat private_portal/dist/CNAME)" = "life.zququ.fun"
          grep -Fxq 'Disallow: /' private_portal/dist/robots.txt
          test "$(wc -c < private_portal/dist/payload.bin)" -gt 44
          ! grep -Eiq 'ZLM|JOB[0-9]+|3S_output|patient id|subject id|medical record' \
            private_portal/dist/.nojekyll \
            private_portal/dist/404.html \
            private_portal/dist/CNAME \
            private_portal/dist/index.html \
            private_portal/dist/robots.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./private_portal/dist
          force_orphan: true
