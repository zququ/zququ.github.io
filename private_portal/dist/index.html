<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'self'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101214">
  <title>Life · Private</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #101214; color: #f3f3ef; }
    body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
    main { width: min(100%, 360px); }
    h1 { margin: 0 0 8px; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: #a9adb2; font-size: 14px; line-height: 1.55; }
    form { display: grid; gap: 12px; }
    label { color: #d8d9d5; font-size: 14px; }
    input { width: 100%; height: 46px; border: 1px solid #45494f; border-radius: 8px; background: #191c1f; color: #fff; padding: 0 13px; font: inherit; outline: none; }
    input:focus { border-color: #d9a85d; box-shadow: 0 0 0 3px rgba(217, 168, 93, 0.16); }
    button { height: 44px; border: 0; border-radius: 8px; background: #e0ad61; color: #17120b; font: 650 15px/1 inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #status { min-height: 22px; margin: 2px 0 0; color: #e28a82; font-size: 13px; }
    .note { margin-top: 20px; padding-top: 16px; border-top: 1px solid #292c30; font-size: 12px; color: #7f848a; }
  </style>
</head>
<body>
  <main>
    <h1>Private visualization</h1>
    <p>请输入访问密码。页面刷新或关闭后会重新锁定。</p>
    <form id="unlock-form">
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
      <button id="submit" type="submit">解锁</button>
      <p id="status" role="alert" aria-live="polite"></p>
    </form>
    <p class="note">内容以加密文件保存，不使用本地持久登录。</p>
  </main>
  <script>
    const form = document.querySelector("#unlock-form");
    const passwordInput = document.querySelector("#password");
    const submit = document.querySelector("#submit");
    const status = document.querySelector("#status");

    const fail = (message) => {
      status.textContent = message;
      submit.disabled = false;
      submit.textContent = "解锁";
      passwordInput.select();
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!window.crypto?.subtle || !window.DecompressionStream) {
        fail("当前浏览器不支持安全解锁，请更新微信或系统浏览器。");
        return;
      }
      submit.disabled = true;
      submit.textContent = "正在解锁…";
      status.textContent = "";
      try {
        const response = await fetch(`payload.bin?v=2`, { cache: "no-store" });
        if (!response.ok) throw new Error("payload unavailable");
        const bytes = new Uint8Array(await response.arrayBuffer());
        const salt = bytes.slice(0, 16);
        const iv = bytes.slice(16, 28);
        const tag = bytes.slice(28, 44);
        const ciphertext = bytes.slice(44);
        const passwordBytes = new TextEncoder().encode(passwordInput.value);
        const material = await crypto.subtle.importKey("raw", passwordBytes, "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations: 310000 },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        const combined = new Uint8Array(ciphertext.length + tag.length);
        combined.set(ciphertext, 0);
        combined.set(tag, ciphertext.length);
        const plaintext = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, combined);
        const decompressedStream = new Blob([plaintext]).stream().pipeThrough(new DecompressionStream("gzip"));
        const html = new TextDecoder().decode(await new Response(decompressedStream).arrayBuffer());
        passwordInput.value = "";
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        fail("密码不正确，或加密内容暂时不可用。");
      }
    });
  </script>
</body>
</html>
