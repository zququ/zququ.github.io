<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Pathological glutamate release profile in FCD tissue</title>
  <desc id="desc">Schematic comparing tonic release, phasic spike amplitude, and event-size distribution between control tissue and FCD epileptogenic foci.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9f5"/>
      <stop offset="100%" stop-color="#f4fbf8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#33201d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#493d39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .panel{fill:#ffffff;stroke:#ead9cd;stroke-width:1.4;rx:26;filter:url(#softShadow)}
      .title{font:700 26px Georgia,serif;fill:#33251f}
      .subtitle{font:600 18px Georgia,serif;fill:#8e4d45}
      .label{font:500 15px Georgia,serif;fill:#433833}
      .small{font:500 13px Georgia,serif;fill:#6d5f58}
      .axis{stroke:#998b84;stroke-width:2}
      .ctrl{stroke:#87928e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .foci{stroke:#df7068;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .fociFill{fill:#df7068;opacity:0.18}
      .ctrlFill{fill:#87928e;opacity:0.18}
      .dash{stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1100" height="580" fill="url(#bg)"/>
  <text x="60" y="58" class="title">FCD epileptogenic tissue shows larger tonic and phasic glutamate release</text>
  <text x="62" y="88" class="small">Redrawn quantitative summary based on Zhao et al. 2026; values are from the reported text.</text>

  <rect x="55" y="125" width="305" height="365" class="panel"/>
  <rect x="397" y="125" width="305" height="365" class="panel"/>
  <rect x="740" y="125" width="305" height="365" class="panel"/>

  <text x="85" y="165" class="subtitle">Tonic release after stimulation</text>
  <line x1="100" y1="420" x2="315" y2="420" class="axis"/>
  <line x1="100" y1="420" x2="100" y2="220" class="axis"/>
  <path d="M106 389 C145 388 170 386 194 380 C222 372 252 360 314 344" class="ctrl"/>
  <path d="M106 389 C145 386 170 375 194 350 C224 309 261 269 314 225" class="foci"/>
  <line x1="188" y1="420" x2="188" y2="205" stroke="#d6c6bc" stroke-width="2" class="dash"/>
  <text x="172" y="445" class="small">stim</text>
  <text x="118" y="245" class="label" fill="#df7068">foci: 247.6 pA</text>
  <text x="118" y="330" class="label">ctrl: 35.5 pA</text>
  <text x="116" y="462" class="small">slow baseline rise reflects tonic glutamate</text>

  <text x="427" y="165" class="subtitle">Phasic quantal events</text>
  <line x1="442" y1="402" x2="650" y2="402" class="axis"/>
  <path d="M462 397 C481 397 484 380 491 342 C500 284 516 284 526 343 C533 381 541 397 565 397" class="ctrl"/>
  <path d="M536 397 C557 397 560 365 568 300 C579 218 596 218 608 302 C617 365 625 397 650 397" class="foci"/>
  <text x="457" y="236" class="label" fill="#df7068">foci: 33.5 pA</text>
  <text x="457" y="260" class="small">larger spike amplitude</text>
  <text x="457" y="319" class="label">ctrl: 25.0 pA</text>
  <text x="457" y="445" class="small">t1/2 stays near 3.8 ms</text>
  <path d="M650 260 C676 278 683 300 686 338" fill="none" stroke="#493d39" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="209" class="small">single amperometric spike</text>

  <text x="770" y="165" class="subtitle">Event-size distribution shifts right</text>
  <line x1="790" y1="420" x2="1000" y2="420" class="axis"/>
  <line x1="790" y1="420" x2="790" y2="225" class="axis"/>
  <path d="M800 417 C830 402 842 342 872 321 C905 298 933 345 957 383 C974 407 988 416 1000 418 L800 418 Z" class="ctrlFill"/>
  <path d="M810 418 C842 410 872 372 906 316 C938 263 974 281 1000 335 C1018 372 1028 404 1034 418 L810 418 Z" class="fociFill"/>
  <path d="M800 417 C830 402 842 342 872 321 C905 298 933 345 957 383 C974 407 988 416 1000 418" class="ctrl"/>
  <path d="M810 418 C842 410 872 372 906 316 C938 263 974 281 1000 335 C1018 372 1028 404 1034 418" class="foci"/>
  <line x1="902" y1="420" x2="902" y2="287" stroke="#8ab5aa" stroke-width="2" class="dash"/>
  <text x="815" y="454" class="small">released molecules per spike</text>
  <text x="812" y="238" class="label" fill="#df7068">more large events in foci</text>
  <text x="812" y="265" class="small">peak around 280k molecules/spike</text>
  <text x="812" y="292" class="small">stimulation makes the shift clearer</text>
</svg>
