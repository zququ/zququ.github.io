<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Ultra-fast glutamate sensor workflow</title>
  <desc id="desc">Schematic showing chitosan electrodeposition, nanoscale enzyme coating on carbon fiber electrode, and ex vivo glutamate recording with a sentinel electrode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbf8"/>
      <stop offset="100%" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86dfcb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#35b89d" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a2f2a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#2f4f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .panel{fill:#ffffff;stroke:#cfe3da;stroke-width:1.4;rx:26;filter:url(#softShadow)}
      .title{font:700 26px Georgia,serif;fill:#173b35}
      .subtitle{font:600 18px Georgia,serif;fill:#2f6b5d}
      .label{font:500 15px Georgia,serif;fill:#314540}
      .small{font:500 13px Georgia,serif;fill:#526b64}
      .micro{font:600 12px Georgia,serif;fill:#f6fbf8}
      .muted{stroke:#9fb8af;stroke-width:2}
      .green{stroke:#2fbf9b;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .red{stroke:#db6a6a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dark{stroke:#21312e;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1100" height="580" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Ultra-fast glutamate sensor: from thin enzyme coating to ex vivo release recording</text>
  <text x="62" y="88" class="small">Redrawn schematic based on Zhao et al. 2026; not a reproduction of the original figures.</text>

  <rect x="55" y="125" width="305" height="365" class="panel"/>
  <rect x="397" y="125" width="305" height="365" class="panel"/>
  <rect x="740" y="125" width="305" height="365" class="panel"/>

  <text x="85" y="165" class="subtitle">1. Rapid electrodeposition</text>
  <path d="M125 360 L125 250 Q125 230 145 230 L265 230 Q285 230 285 250 L285 360" fill="none" stroke="#38544d" stroke-width="6" stroke-linecap="round"/>
  <path d="M135 352 Q205 392 275 352 L275 255 Q205 290 135 255 Z" fill="url(#drop)" opacity="0.92"/>
  <text x="151" y="311" class="micro">GluOx + CS</text>
  <line x1="205" y1="205" x2="205" y2="348" stroke="#222" stroke-width="10" stroke-linecap="round"/>
  <line x1="205" y1="205" x2="205" y2="348" stroke="#f4c95d" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
  <path d="M83 405 C125 382 166 392 205 405 C244 418 286 428 330 405" class="green"/>
  <text x="85" y="436" class="label">ORR raises local pH</text>
  <text x="85" y="460" class="small">CS sol-gel transition traps GluOx on CFE</text>

  <text x="427" y="165" class="subtitle">2. Nanoscale coating</text>
  <circle cx="550" cy="308" r="82" fill="#22302d"/>
  <circle cx="550" cy="308" r="64" fill="#334a44"/>
  <circle cx="550" cy="308" r="50" fill="#1d2926"/>
  <circle cx="508" cy="255" r="7" fill="#e7b84c"/>
  <circle cx="585" cy="250" r="7" fill="#e7b84c"/>
  <circle cx="618" cy="309" r="7" fill="#e7b84c"/>
  <circle cx="585" cy="366" r="7" fill="#e7b84c"/>
  <circle cx="508" cy="361" r="7" fill="#e7b84c"/>
  <circle cx="482" cy="309" r="7" fill="#e7b84c"/>
  <circle cx="550" cy="308" r="94" fill="none" stroke="#36bfa0" stroke-width="9" stroke-dasharray="18 10"/>
  <path d="M654 245 C694 232 704 220 715 192" class="dark" marker-end="url(#arrow)"/>
  <text x="632" y="209" class="label">ultra-thin</text>
  <text x="632" y="231" class="small">GluOx-CS layer</text>
  <path d="M445 383 C420 405 414 421 410 448" class="dark" marker-end="url(#arrow)"/>
  <text x="425" y="430" class="label">5 um CFE</text>
  <text x="425" y="454" class="small">PtNPs improve reaction interface</text>

  <text x="770" y="165" class="subtitle">3. Ex vivo brain slice recording</text>
  <path d="M805 378 C842 303 926 285 1005 338 C1029 355 1030 401 1001 420 C932 467 829 442 805 378 Z" fill="#e7efe9" stroke="#bad2c8" stroke-width="2"/>
  <path d="M833 379 C873 335 938 333 985 365" fill="none" stroke="#c9ded5" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="875" y1="235" x2="875" y2="368" stroke="#1e2c29" stroke-width="7" stroke-linecap="round"/>
  <line x1="937" y1="235" x2="937" y2="374" stroke="#54615e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="875" cy="370" r="10" fill="#34bd9e"/>
  <circle cx="937" cy="376" r="8" fill="#a8b6b1"/>
  <text x="804" y="224" class="label">GluOx sensor</text>
  <text x="931" y="224" class="label">sentinel</text>
  <circle cx="850" cy="396" r="6" fill="#35b89d"/>
  <circle cx="861" cy="410" r="4" fill="#35b89d"/>
  <circle cx="842" cy="421" r="5" fill="#35b89d"/>
  <path d="M790 455 C820 443 840 446 858 454 C885 466 910 462 934 449 C955 438 977 438 1002 450" class="green"/>
  <path d="M790 480 C825 474 852 480 878 472 C913 460 946 464 1005 472" class="muted" fill="none"/>
  <text x="785" y="512" class="small">working trace - sentinel trace = glutamate signal</text>
</svg>
