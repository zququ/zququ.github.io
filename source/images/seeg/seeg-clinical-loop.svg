<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SEEG clinical translation loop</title>
  <desc id="desc">A schematic loop showing data, model, explanation, clinician review, and prospective validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fff7"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4f46"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <text x="82" y="72" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#1f2937">Clinical translation is a feedback loop</text>
  <text x="82" y="108" font-family="Menlo, Consolas, monospace" font-size="16" fill="#53645f">A useful warning system needs stability, explanation, calibration, and prospective validation.</text>
  <g transform="translate(600 280)" stroke="#2f4f46" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M0 -155 C118 -155 205 -90 205 0"/>
    <path d="M205 0 C205 100 110 165 0 165"/>
    <path d="M0 165 C-120 165 -205 92 -205 0"/>
    <path d="M-205 0 C-205 -105 -110 -155 0 -155"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" filter="url(#shadow)">
    <g transform="translate(468 94)">
      <rect width="264" height="74" rx="20" fill="#ecfeff" stroke="#06b6d4"/>
      <text x="24" y="32" font-size="18" font-weight="700" fill="#0e7490">long-term signals</text>
      <text x="24" y="54" font-size="13" fill="#475569">drift, artifacts, sparse seizures</text>
    </g>
    <g transform="translate(790 244)">
      <rect width="264" height="74" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="24" y="32" font-size="18" font-weight="700" fill="#1d4ed8">risk model</text>
      <text x="24" y="54" font-size="13" fill="#475569">calibration + uncertainty</text>
    </g>
    <g transform="translate(468 392)">
      <rect width="264" height="74" rx="20" fill="#fdf2f8" stroke="#d946ef"/>
      <text x="24" y="32" font-size="18" font-weight="700" fill="#a21caf">clinical review</text>
      <text x="24" y="54" font-size="13" fill="#475569">trust, actionability, burden</text>
    </g>
    <g transform="translate(146 244)">
      <rect width="264" height="74" rx="20" fill="#f0fdf4" stroke="#22c55e"/>
      <text x="24" y="32" font-size="18" font-weight="700" fill="#15803d">prospective test</text>
      <text x="24" y="54" font-size="13" fill="#475569">false alarms + outcomes</text>
    </g>
  </g>
  <g transform="translate(505 238)" font-family="Menlo, Consolas, monospace">
    <circle cx="95" cy="42" r="58" fill="#fff" stroke="#d9eadf" stroke-width="3"/>
    <text x="47" y="37" font-size="15" font-weight="700" fill="#334155">patient</text>
    <text x="35" y="60" font-size="13" fill="#64748b">specific loop</text>
  </g>
</svg>
