<header id="header">
  <a class="site-brand" href="{{ '/' | relative_url }}">
    <img
      id="logo"
      src="{{ '/assets/images/avatar.jpg' | relative_url }}"
      alt="{{ site.title }}"
      width="56"
      height="56"
    />
    <div id="title">
      <h1 class="site-title">{{ site.title }}</h1>
      {% if site.subtitle %}
      <p class="site-subtitle">{{ site.subtitle }}</p>
      {% endif %}
    </div>
  </a>

  <nav id="nav" aria-label="Primary">
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-list">
      <span class="nav-toggle__label">Menu</span>
      <span class="nav-toggle__icon" aria-hidden="true"></span>
    </button>
    <ul id="site-nav-list">
      <li><a href="{{ '/' | relative_url }}">home</a></li>
      {% for item in site.nav %}
      {% assign item_external = item.url contains '://' %}
      <li>
        <a
          href="{% if item_external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"
          {% if item_external %}target="_blank" rel="noopener"{% endif %}
        >
          {{ item.title }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</header>
